group 'dev.note11.flutter_naver_map.flutter_naver_map'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://repository.map.naver.com/archive/maven'
        }
    }
}

apply plugin: 'com.android.library'

// AGP 9+ ships built-in Kotlin support and registers its own `kotlin { }` extension,
// which conflicts with the classic 'kotlin-android' plugin unless the app has opted
// out via `android.builtInKotlin=false` in gradle.properties (Flutter's current
// recommended interim state; see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinOptedOut = project.hasProperty('android.builtInKotlin') &&
        !Boolean.parseBoolean(project.property('android.builtInKotlin').toString())
if (agpMajor < 9 || builtInKotlinOptedOut) {
    apply plugin: 'kotlin-android'
}

android {
    namespace "dev.note11.flutter_naver_map.flutter_naver_map"

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
    }

    dependencies {
        implementation 'com.naver.maps:map-sdk:3.23.0'
        implementation 'com.google.android.gms:play-services-location:21.3.0'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}
